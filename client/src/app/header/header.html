<header>
  <h1><a routerLink="/">CourtSide</a></h1>
  <nav aria-label="Main">
    <a routerLink="/" routerLinkActive ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/lessons" routerLinkActive ariaCurrentWhenActive="page" class="nav-cta">Book a Lesson</a>
    <a routerLink="/reviews" routerLinkActive ariaCurrentWhenActive="page">Reviews</a>
    <a routerLink="/snacks" routerLinkActive ariaCurrentWhenActive="page">Snack Shop</a>
    <a routerLink="/proshop" routerLinkActive ariaCurrentWhenActive="page">Pro Shop</a>
    <a routerLink="/services" routerLinkActive ariaCurrentWhenActive="page">Services</a>
    <a routerLink="/orders" routerLinkActive ariaCurrentWhenActive="page">Find My Order</a>
    <!-- The Cart link opens a panel, so tell assistive technology it behaves like a button -->
    <a href="#" id="cartLink" role="button" aria-haspopup="dialog" (click)="openCart($event)" (keydown.space)="openCart($event)">Cart (<span class="cart-count">{{ cart.count() }}</span>)</a>
  </nav>
</header>
